<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMO 실험 시작 — 연구자용</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fa;color:#222;font-family:'Malgun Gothic',Arial,sans-serif}.panel{width:min(440px,calc(100% - 32px));background:#fff;border:1px solid #e5e8ef;border-radius:18px;padding:32px;box-shadow:0 12px 35px #18223a12}h1{font-size:23px;margin:0 0 10px}p{color:#606979;line-height:1.6;font-size:14px}label{display:block;font-weight:700;margin:28px 0 9px}input{width:100%;padding:15px;font-size:18px;border:1px solid #cbd2df;border-radius:10px}input:focus{outline:2px solid #8ba9ef}button{width:100%;padding:15px;border:0;border-radius:10px;background:#3d70c9;color:white;font-weight:700;font-size:16px;margin-top:18px;cursor:pointer}button:hover{background:#315eae}.note{font-size:12px;color:#70798a;margin-top:18px}.error{color:#b3261e;font-size:13px;min-height:20px;margin-top:8px}
</style>
</head>
<body>
<main class="panel">
<h1>SMO 실험 시작</h1>
<p>연구자 전용 화면입니다. 참가자에게 부여한 고유 번호를 입력한 뒤 실험을 시작하세요.</p>
<form id="launch">
<label for="participant">참가자 번호</label>
<input id="participant" type="number" min="1" max="999999" step="1" inputmode="numeric" placeholder="예: 1" required autofocus>
<div id="error" class="error" role="alert"></div>
<button type="submit">실험 시작</button>
</form>
<p class="note">SMO 사회적 배제 조건(c=1)으로 실행됩니다. 동일 참가자 번호를 다른 사람에게 재사용하지 마세요. 시작 전 번호를 관리표와 대조하세요.</p>
</main>
<script>
document.getElementById('launch').addEventListener('submit',function(e){
 e.preventDefault();
 const raw=document.getElementById('participant').value;
 const n=Number(raw);
 if(!Number.isSafeInteger(n)||n<1||n>999999){document.getElementById('error').textContent='1 이상의 올바른 참가자 번호를 입력해 주세요.';return;}
 const target=new URL('index.html',window.location.href);
 target.searchParams.set('p',String(n));
 target.searchParams.set('c','1');
 window.location.assign(target.href);
});
</script>
</body>
</html>
